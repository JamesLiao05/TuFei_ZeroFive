  <!-- 引入 Supabase 官方 JS 库 -->

  <!-- 留言板核心逻辑 -->
  <script>
      // ⚠️⚠️⚠️ 关键步骤：你的 Supabase URL 和 anon key
      const SUPABASE_URL = 'https://iezmnejfdaorhusjxggs.supabase.co'; 
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imllem1uZWpmZGFvcmh1c2p4Z2dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzA2NTMsImV4cCI6MjEwMDk0NjY1M30.MLRHHHGu5ZyjdnTVAT5fE6AM03zjURDdfupJIcuZXM0'; 

      const { createClient } = supabase;
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // 🛡️ 新增：定义一个全局变量，用来记录“上一次发送留言的时间”
      // 初始值为 0，代表很久以前
      let lastSendTime = 0; 

      async function submitTufeiMsg() {
          // 🛡️ 新增：防连点/防刷屏检查
          const now = Date.now(); // 获取当前时间（毫秒）
          
          // 如果当前时间 减去 上次发送时间 小于 3000毫秒（也就是3秒）
          if (now - lastSendTime < 3000) {
              alert('手速太快啦！请休息 3 秒后再发哦~ 🐢');
              return; // 直接停止执行，不往下走
          }
          
          // 如果通过了时间检查，就把“上次发送时间”更新为“现在”
          lastSendTime = now;
          // 🛡️ 防连点逻辑结束

          // --- 下面是你原来的正常逻辑 ---
          const input = document.getElementById('tufeiMsgInput');
          const content = input.value.trim();
          if (!content) return alert('留言不能为空哦！');

          const btn = document.querySelector('.tufei-msg-btn');
          btn.innerText = '发送中...';
          btn.disabled = true;

          const { error } = await supabaseClient.from('messages').insert([{ content }]);

          if (error) {
              console.error('提交失败:', error);
              alert('提交失败，请检查网络');
          } else {
              input.value = '';
              loadTufeiMsgs();
          }
          btn.innerText = '发送';
          btn.disabled = false;
      }

      async function loadTufeiMsgs() {
          const listDiv = document.getElementById('tufeiMsgList');
          const { data, error } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: false }).limit(20);

          if (error) {
              listDiv.innerHTML = '<p class="loading-text" style="color:red;">加载失败</p>';
              return;
          }

          if (data.length === 0) {
              listDiv.innerHTML = '<p class="loading-text">还没有留言，快来抢沙发！</p>';
          } else {
              listDiv.innerHTML = data.map(msg => `
                  <div class="tufei-msg-item">
                      <span class="msg-text">${escapeHtml(msg.content)}</span>
                      <span class="tufei-msg-time">${new Date(msg.created_at).toLocaleString()}</span>
                  </div>
              `).join('');
          }
      }

      function escapeHtml(text) {
          const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
          return text.replace(/[&<>"']/g, m => map[m]);
      }

      document.addEventListener('DOMContentLoaded', loadTufeiMsgs);
  </script>
