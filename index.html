      /* --- 手机端适配优化 --- */
      @media (max-width: 768px) {

  <!-- 引入 Supabase JS 库 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
      const SUPABASE_URL = 'https://iezmnejfdaorhusjxggs.supabase.co'; 
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imllem1uZWpmZGFvcmh1c2p4Z2dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzA2NTMsImV4cCI6MjEwMDk0NjY1M30.MLRHHHGu5ZyjdnTVAT5fE6AM03zjURDdfupJIcuZXM0'; 
      const { createClient } = supabase;
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let lastSendTime = 0; 
      let isAdminLoggedIn = false;

      // 获取游客ID
      function getGuestId() {
          let guestId = localStorage.getItem('tufei_guest_id');
          if (!guestId) {
              guestId = 'guest_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
              localStorage.setItem('tufei_guest_id', guestId);
          }
          return guestId;
      }

      // 右上角按钮点击：登录/登出切换
      function handleAdminEntry() {
          if (isAdminLoggedIn) {
              adminLogout();
          } else {
              showAdminLogin();
          }
      }

      // 关闭管理员弹窗
      function closeAdminPanel() {
          document.getElementById('adminSection').style.display = 'none';
          // 兜底重置按钮状态
          const btn = document.getElementById('loginBtn');
          btn.innerText = '登录';
          btn.disabled = false;
      }

      // ================= 1. 发送弹幕（支持 Enter 快捷键） =================
      async function submitTufeiMsg() {
          const now = Date.now();
          if (now - lastSendTime < 3000) return alert('手速太快啦！请休息 3 秒后再发哦~ 🐢');
          lastSendTime = now;

          const input = document.getElementById('tufeiMsgInput');
          const content = input.value.trim();
          if (!content) return alert('留言不能为空哦！');

          const btn = document.querySelector('.tufei-msg-btn');
          btn.innerText = '发射弹幕...';
          btn.disabled = true;

          const guest_id = getGuestId();
          const { error } = await supabaseClient.from('messages').insert([{ content, guest_id }]);
          
          if (error) {
              console.error('提交失败:', error);
              if (error.code === '42501' || error.message.includes('row-level security')) {
                  alert('📢 今天的 2 条弹幕额度已经用完啦！明天再来吧~');
              } else {
                  alert('发射失败，请检查网络');
              }
          } else {
              input.value = '';
              addSingleDanmaku(content);
              // 如果侧边栏打开，同步刷新列表
              if (document.getElementById('danmakuPanel').classList.contains('open')) {
                  loadPanelDanmaku();
              }
          }
          
          btn.innerText = '发射';
          btn.disabled = false;
      }

      // ================= 2. 弹幕动画逻辑 =================
      function addSingleDanmaku(content) {
          const container = document.getElementById('tufeiMsgList');
          const containerHeight = window.innerHeight;
          const div = document.createElement('div');
          div.className = 'danmaku-item';
          div.innerText = content;
          div.style.top = `${Math.random() * Math.max(10, containerHeight - 50)}px`;
          const duration = 8 + Math.random() * 8;
          div.style.animationDuration = `${duration}s`;
          div.style.animationDelay = `0s`; 
          container.appendChild(div);
          div.addEventListener('animationend', () => div.remove());
      }

      async function loadDanmaku() {
          const container = document.getElementById('tufeiMsgList');
          container.innerHTML = '<p class="loading-text">弹幕装填中...</p>';

          const { data, error } = await supabaseClient.from('messages')
              .select('content').order('created_at', { ascending: false }).limit(30);

          if (error || !data) { 
              console.error('弹幕加载错误:', error);
              container.innerHTML = `<p class="loading-text" style="color:red;">弹幕故障: ${error ? error.message : '未知错误'}</p>`; 
              return; 
          }
          
          container.innerHTML = '';
          if (data.length === 0) {
              container.innerHTML = '<p class="loading-text">还没有弹幕，快来发射第一条！</p>';
              return;
          }

          const containerHeight = window.innerHeight;
          data.forEach((msg) => {
              const div = document.createElement('div');
              div.className = 'danmaku-item';
              div.innerText = msg.content;
              div.style.top = `${Math.random() * Math.max(10, containerHeight - 50)}px`;
              const duration = 8 + Math.random() * 8;
              div.style.animationDuration = `${duration}s`;
              div.style.animationDelay = `-${Math.random() * duration}s`;
              container.appendChild(div);
              div.addEventListener('animationend', () => div.remove());
          });
      }

      // ================= 3. 侧边栏面板逻辑 =================
      function openDanmakuPanel() {
          document.getElementById('danmakuPanel').classList.add('open');
          document.getElementById('panelOverlay').style.display = 'block';
          loadPanelDanmaku(); 
      }

      function closeDanmakuPanel() {
          document.getElementById('danmakuPanel').classList.remove('open');
          document.getElementById('panelOverlay').style.display = 'none';
      }

      function formatTimeToMinute(dateString) {
          const date = new Date(dateString);
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          const hours = String(date.getHours()).padStart(2, '0');
          const minutes = String(date.getMinutes()).padStart(2, '0');
          return `${month}-${day} ${hours}:${minutes}`;
      }

      // 侧边栏弹幕列表加载（含删除按钮）
      async function loadPanelDanmaku() {
          const listDom = document.getElementById('panelDanmakuList');
          listDom.innerHTML = '<p style="text-align:center; color:#aaa;">加载中……</p>';
          const { data, error } = await supabaseClient
              .from('messages')
              .select('id, content, created_at')
              .order('created_at', {ascending:false})
              .limit(100);
          if(error){
              listDom.innerHTML = `<p style="color:red;text-align:center;">加载失败：${error.message}</p>`;
              return;
          }
          if(data.length===0){
              listDom.innerHTML = '<p style="text-align:center; color:#aaa;">暂无弹幕</p>';
              return;
          }
          listDom.innerHTML = data.map(item=>`
              <div class="panel-danmaku-card">
                  <div class="panel-danmaku-text">${escapeHtml(item.content)}</div>
                  <div class="panel-danmaku-footer">
                      <div class="panel-danmaku-time">${formatTimeToMinute(item.created_at)}</div>
                      <button class="danmaku-delete-btn" onclick="deleteMsg(${item.id})">×</button>
                  </div>
              </div>
          `).join("");
      }

      // ================= 4. 管理员逻辑 =================
      function showAdminLogin() {
          document.getElementById('adminSection').style.display = 'flex';
      }

      async function adminLogin() {
          const email = document.getElementById('adminEmail').value;
          const password = document.getElementById('adminPassword').value;
          const btn = document.getElementById('loginBtn');
          btn.innerText = '登录中...';
          btn.disabled = true;

          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          
          // 无论成功失败，都重置按钮状态（成功会自动关弹窗）
          if (error) {
              alert('登录失败：' + error.message);
              btn.innerText = '登录';
              btn.disabled = false;
          }
      }

      async function adminLogout() {
          await supabaseClient.auth.signOut();
          alert('已退出登录');
      }

      // 删除弹幕
      async function deleteMsg(id) {
          if (!confirm('确定要删除这条弹幕吗？')) return;
          const { error } = await supabaseClient.from('messages').delete().eq('id', id);
          if (error) {
              alert('删除失败：' + error.message);
          } else {
              loadPanelDanmaku();
              loadDanmaku();
          }
      }

      function escapeHtml(text) {
          const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
          return text.replace(/[&<>"']/g, m => map[m]);
      }

      // 页面加载完成后执行
      document.addEventListener('DOMContentLoaded', () => {
          loadDanmaku();

          // Enter 键快捷发送弹幕
          document.getElementById('tufeiMsgInput').addEventListener('keydown', e => {
              if (e.key === 'Enter') submitTufeiMsg();
          });

          // 登录状态监听
          supabaseClient.auth.onAuthStateChange((event, session) => {
              const panel = document.getElementById('danmakuPanel');
              const entryBtn = document.getElementById('adminEntryBtn');
              
              if (event === 'SIGNED_IN' && session) {
                  isAdminLoggedIn = true;
                  alert('登录成功');
                  closeAdminPanel();
                  panel.classList.add('admin-active');
                  entryBtn.innerText = '🚪';
                  entryBtn.title = '退出登录';
                  // 侧边栏打开时刷新列表显示删除按钮
                  if (panel.classList.contains('open')) {
                      loadPanelDanmaku();
                  }
              } else if (event === 'SIGNED_OUT') {
                  isAdminLoggedIn = false;
                  panel.classList.remove('admin-active');
                  entryBtn.innerText = '🔐';
                  entryBtn.title = '管理员登录';
                  closeAdminPanel();
              }
          });

          // 初始化会话校验
          supabaseClient.auth.getSession().then(({ data: { session } }) => {
              const panel = document.getElementById('danmakuPanel');
              const entryBtn = document.getElementById('adminEntryBtn');
              if (session) {
                  isAdminLoggedIn = true;
                  panel.classList.add('admin-active');
                  entryBtn.innerText = '🚪';
                  entryBtn.title = '退出登录';
              }
          });
      });
  </script>

</body>
</html>
