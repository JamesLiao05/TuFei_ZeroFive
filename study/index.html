<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2ef">
<title>刷题宝典</title>
<script>
(function(){
  var t='light';
  try{
    t=localStorage.getItem('shuati.theme')||'';
    if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  }catch(e){}
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
/* ============ 主题变量：黑白 + 石墨灰彩色 ============ */
:root{
  --r:18px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --fast:.16s var(--ease);
  --mid:.28s var(--ease);
}
html[data-theme="light"]{
  --bg:#f2f2ef;
  --bg-glow:radial-gradient(1100px 520px at 50% -12%, #ffffff 0%, rgba(255,255,255,0) 62%);
  --card:#ffffff;
  --card-2:#fafaf8;
  --ink:#141517;
  --ink-2:#383b40;
  --sub:#71757c;
  --line:#e7e7e3;
  --line-2:#dcdcd6;
  --accent:#3f4a55;
  --accent-2:#5a6470;
  --accent-soft:#edeff1;
  --on-accent:#ffffff;
  --ok:#3d7a5f; --ok-soft:#eaf3ee; --ok-line:#c3dccf;
  --bad:#9a4f4a; --bad-soft:#f8ecea; --bad-line:#e6c6c3;
  --hero-a:#17191d; --hero-b:#282d34; --hero-ink:#f6f7f9;
  --shadow-s:0 1px 2px rgba(18,20,24,.05), 0 4px 10px rgba(18,20,24,.05);
  --shadow-m:0 2px 6px rgba(18,20,24,.06), 0 14px 30px rgba(18,20,24,.08);
  --shadow-l:0 10px 26px rgba(18,20,24,.12), 0 30px 60px rgba(18,20,24,.10);
  --ring:0 0 0 3px rgba(63,74,85,.14);
}
html[data-theme="dark"]{
  --bg:#0b0c0e;
  --bg-glow:radial-gradient(1100px 520px at 50% -12%, #1b1e23 0%, rgba(0,0,0,0) 60%);
  --card:#151619;
  --card-2:#1a1b1f;
  --ink:#ecedf0;
  --ink-2:#c7cbd1;
  --sub:#888d95;
  --line:#24262b;
  --line-2:#30333a;
  --accent:#dfe3ea;
  --accent-2:#b8c0cc;
  --accent-soft:#1e2024;
  --on-accent:#111214;
  --ok:#5fbf95; --ok-soft:#12241c; --ok-line:#26503e;
  --bad:#e08d86; --bad-soft:#261614; --bad-line:#4a2724;
  --hero-a:#101114; --hero-b:#1e2126; --hero-ink:#f4f6f8;
  --shadow-s:0 1px 2px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.35);
  --shadow-m:0 2px 8px rgba(0,0,0,.55), 0 16px 34px rgba(0,0,0,.45);
  --shadow-l:0 12px 30px rgba(0,0,0,.6), 0 34px 70px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(223,227,234,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);
  background-image:var(--bg-glow);
  background-attachment:fixed;
  color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overscroll-behavior-y:contain;
  transition:background-color .35s var(--ease), color .35s var(--ease);
}
#app{max-width:620px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 14px 28px;animation:pageIn .4s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
::selection{background:var(--accent);color:var(--on-accent)}

/* ============ 通用控件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:14px;background:var(--card);color:var(--ink);
  border:1px solid var(--line);font-weight:600;
  box-shadow:var(--shadow-s);
  transition:transform var(--fast),box-shadow var(--fast),border-color var(--fast),background var(--fast);
}
.btn:hover{border-color:var(--line-2);box-shadow:var(--shadow-m);transform:translateY(-1px)}
.btn:active{transform:scale(.97);box-shadow:var(--shadow-s)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;box-shadow:var(--shadow-m)}
.btn.pri:hover{box-shadow:var(--shadow-l)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--accent-soft);box-shadow:none}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad-line);background:transparent;box-shadow:none}
.btn.danger:hover{background:var(--bad-soft);box-shadow:none}
.row{display:flex;gap:10px}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 2px 8px;position:sticky;top:0;z-index:6;background:linear-gradient(var(--bg) 68%,transparent)}
.topbar .ttl{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1;box-shadow:var(--shadow-s);transition:transform var(--fast),box-shadow var(--fast)}
.iconbtn:hover{box-shadow:var(--shadow-m)}
.iconbtn:active{transform:scale(.94)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 2px 14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .4s var(--ease)}

/* ============ 首页 ============ */
.hero{
  margin:14px 0 16px;padding:22px;border-radius:26px;color:var(--hero-ink);
  background:linear-gradient(135deg,var(--hero-a),var(--hero-b));
  box-shadow:var(--shadow-l);
  position:relative;overflow:hidden;
  transition:box-shadow var(--mid);
}
.hero:after{
  content:'';position:absolute;inset:-40% -10% auto auto;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10),transparent 65%);
  pointer-events:none;
}
.hero h1{margin:6px 0 4px;font-size:22px;line-height:1.3;letter-spacing:.01em}
.hero .sub{opacity:.72;font-size:13px}
.hero .nums{display:flex;gap:18px;margin-top:16px;font-size:12px;opacity:.9}
.hero .nums b{display:block;font-size:20px;font-weight:700;letter-spacing:.02em}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  background:var(--card);border-radius:var(--r);padding:17px 16px;
  border:1px solid var(--line);box-shadow:var(--shadow-s);
  display:flex;flex-direction:column;gap:4px;text-align:left;
  transition:transform var(--fast),box-shadow var(--fast),border-color var(--fast),background var(--fast);
  animation:rise .5s var(--ease) both;
}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.tile:nth-child(1){animation-delay:.02s}
.tile:nth-child(2){animation-delay:.05s}
.tile:nth-child(3){animation-delay:.08s}
.tile:nth-child(4){animation-delay:.11s}
.tile:nth-child(5){animation-delay:.14s}
.tile:nth-child(6){animation-delay:.17s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-m);border-color:var(--line-2)}
.tile:active{transform:scale(.985);box-shadow:var(--shadow-s)}
.tile .em{font-size:22px;line-height:1.2}
.tile b{font-size:16px;letter-spacing:.01em}
.tile span{font-size:12px;color:var(--sub)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.tile.wide .txt{flex:1}
.tile.wide b{display:block}
.sect{margin:24px 2px 10px;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* ============ 题目卡片 ============ */
.stage{touch-action:pan-y}
.card{
  background:var(--card);border-radius:var(--r);padding:20px;
  box-shadow:var(--shadow-m);border:1px solid var(--line);
  transition:background var(--mid),border-color var(--mid),box-shadow var(--mid);
}
.card.inR{animation:inR .34s var(--ease) both}
.card.inL{animation:inL .34s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(28px) scale(.99)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px) scale(.99)}to{opacity:1;transform:none}}
.qmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:12px}
.tag{padding:2px 9px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;letter-spacing:.02em}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.stem{font-size:17px;line-height:1.75;font-weight:600;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--card-2);text-align:left;
  font-size:15px;line-height:1.55;
  transition:transform var(--fast),border-color var(--fast),background var(--fast),box-shadow var(--fast);
}
button.opt:hover{border-color:var(--line-2);box-shadow:var(--shadow-s);transform:translateY(-1px)}
.opt:active{transform:scale(.99)}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  color:var(--sub);margin-top:1px;transition:all var(--fast);
}
.opt .t{flex:1;word-break:break-word}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--ring)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft);animation:pop .3s var(--ease)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft);animation:shake .32s var(--ease)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes pop{0%{transform:scale(.99)}55%{transform:scale(1.012)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.explain{
  margin-top:16px;padding:14px 16px;border-radius:12px;
  background:var(--accent-soft);border:1px solid var(--line);border-left:3px solid var(--accent);
  font-size:14px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;
  animation:fadeIn .3s var(--ease) both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.explain b{color:var(--accent);font-weight:700}
.foot{display:flex;align-items:center;gap:10px;margin-top:18px}
.foot .mid{flex:1;display:flex;justify-content:center}
.sheet{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:14px}
.sheet b{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;
  background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--sub);
  transition:all var(--fast);
}
.sheet b:hover{border-color:var(--line-2);box-shadow:var(--shadow-s)}
.sheet b.done{background:var(--accent-soft);border-color:var(--line-2);color:var(--accent)}
.sheet b.cur{outline:2px solid var(--accent);outline-offset:1px}
.sheet b.wrong{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.sheet b.right{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}

/* ============ 结果页 ============ */
.score{
  text-align:center;padding:30px 16px 22px;border-radius:26px;
  color:var(--hero-ink);background:linear-gradient(135deg,var(--hero-a),var(--hero-b));
  box-shadow:var(--shadow-l);margin:12px 0 18px;
  animation:rise .45s var(--ease) both;
}
.score .big{font-size:48px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.score .lbl{font-size:13px;opacity:.7;margin-top:2px}
.score .stats2{display:flex;justify-content:center;gap:26px;margin-top:14px;font-size:13px;opacity:.9}
.wq{padding:15px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s);margin-bottom:10px;font-size:14px}
.wq .s{font-weight:600;margin-bottom:6px;white-space:pre-wrap}
.wq .a{font-size:13px;color:var(--sub)}
.wq .a i{font-style:normal;color:var(--ok);font-weight:700}
.wq .a u{text-decoration:none;color:var(--bad);font-weight:700}

/* ============ 其它 ============ */
.panel{background:var(--card);border-radius:var(--r);padding:18px;border:1px solid var(--line);box-shadow:var(--shadow-s);margin-bottom:12px;transition:background var(--mid),border-color var(--mid)}
.panel h3{margin:0 0 8px;font-size:15px;letter-spacing:.01em}
.panel p{margin:6px 0;font-size:13px;color:var(--sub)}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.7}
.verbar{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 0 0;font-size:11px;color:var(--sub);letter-spacing:.02em}
.verbar .ver{font-weight:700;color:var(--accent)}
.verbar button{font-size:12px;line-height:1;padding:2px 4px;cursor:pointer}
.empty{text-align:center;padding:50px 20px;color:var(--sub);font-size:14px}
.toast{
  position:fixed;left:50%;bottom:52px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;
  z-index:99;box-shadow:var(--shadow-l);animation:tin .26s var(--ease);
}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* 背题模式 */
.opt.static{cursor:default}
.opt.static:hover{border-color:var(--line);box-shadow:none;transform:none}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);white-space:nowrap}
.switch i{width:36px;height:21px;border-radius:99px;background:var(--line-2);position:relative;transition:background var(--fast);display:inline-block;flex:0 0 auto}
.switch i:after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--card);transition:transform var(--fast);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on i{background:var(--accent)}
.switch.on i:after{transform:translateX(15px)}
.blindmsg{text-align:center;color:var(--sub);font-size:13px;padding:16px 0 4px}
.d-hint{display:none}
.settings-wrap{max-width:760px;margin:0 auto;width:100%}
input[type=checkbox].mini-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0 2px 0 0;flex:0 0 auto}

/* 主题切换按钮 */
.fab{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
  width:44px;height:44px;border-radius:50%;
  background:var(--card);color:var(--ink);border:1px solid var(--line);
  box-shadow:var(--shadow-m);font-size:18px;line-height:1;z-index:80;
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--fast),box-shadow var(--fast),background var(--mid);
}
.fab:hover{transform:translateY(-2px);box-shadow:var(--shadow-l)}
.fab:active{transform:scale(.93)}

/* ============ 桌面端 ============ */
@media (min-width:900px){
  body{font-size:17px}
  #app{max-width:1040px;padding:0 26px 60px}
  .home-wrap{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start;margin-top:16px}
  .home-wrap .hero{position:sticky;top:20px;margin:0;padding:26px}
  .home-wrap .hero h1{font-size:25px}
  .home-wrap .hero .nums{margin-top:22px;font-size:13px}
  .modes{grid-template-columns:1fr 1fr}
  .play-wrap{max-width:820px;margin:0 auto;width:100%}
  .card{padding:28px 30px}
  .stem{font-size:19px}
  .opt{padding:16px;font-size:16px}
  .m-hint{display:none}
  .d-hint{display:block}
  .topbar{backdrop-filter:blur(8px)}
}
@media (max-width:520px){
  #app{padding:0 11px 24px}
  .hero{padding:18px}
  .hero h1{font-size:20px}
  .stem{font-size:16px}
  .sheet{grid-template-columns:repeat(6,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="themeBtn" type="button" aria-label="切换深浅色主题" title="切换主题">☾</button>
<script src="bank.js"></script>
<script>
(function(){
'use strict';

/* ---------------- utils ---------------- */
var $ = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var KEY='shuati.bank.v1';

/* ---------------- demo ---------------- */
var DEMO=(window.BANK&&window.BANK.questions&&window.BANK.questions.length)?window.BANK:{title:'题库未加载',questions:[]};

/* ---------------- storage ---------------- */
function defDB(){return {bank:null,wrong:{},fav:{},seen:{},stats:{answered:0,correct:0},pos:{},seeded:false,settings:{blind:false,copyOpts:true},examState:null};}
var DB;
try{var raw=localStorage.getItem(KEY);DB=raw?Object.assign(defDB(),JSON.parse(raw)):defDB();}catch(e){DB=defDB();}
if(!DB.settings)DB.settings={blind:false};
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}

/* ---------------- 设备标识（cookie + localStorage 双写） ---------------- */
var DEVICE_ID=(function(){
  var id='',ck='';
  try{var m=document.cookie.match(/(?:^|;\s*)shuati_device=([^;]+)/);ck=m?decodeURIComponent(m[1]):'';}catch(e){}
  try{id=localStorage.getItem('shuati_device')||'';}catch(e){}
  if(!ck)ck=id;
  if(!ck){
    ck='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  }
  try{localStorage.setItem('shuati_device',ck);}catch(e){}
  try{document.cookie='shuati_device='+encodeURIComponent(ck)+';path=/;max-age=31536000;SameSite=Lax';}catch(e){}
  return ck;
})();
function qlist(){return (DB.bank&&DB.bank.questions)||[];}
function qById(id){var a=qlist();for(var i=0;i<a.length;i++){if(a[i].id!==undefined&&a[i].id===id)return a[i];}return null;}
function prepareBank(){
  var cur=DB.bank;
  // 内置题库：没数据、或上次用的还是内置题库时，自动跟随文件里的题库
  var useBuiltin=!cur||cur.seed===true||/示例题库/.test(String(cur.title||''));
  if(useBuiltin){DB.bank={title:DEMO.title,questions:DEMO.questions,seed:true};DB.seeded=true;}
  var raw=DB.bank.questions||[];
  var qs=raw.map(normQ).filter(function(q){return q.stem;});
  qs.forEach(function(q,i){q.id='q'+i;});
  DB.bank.questions=qs;
  DB.bank.title=DB.bank.title||'我的题库';
}

/* ---------------- normalize ---------------- */
function normQ(raw){
  var q={type:raw.type||'single',stem:String(raw.stem||'').trim(),options:[],answer:[],analysis:String(raw.analysis||'').trim()};
  var opts=raw.options||[];
  if(opts.length && typeof opts[0]==='string'){q.options=opts.map(function(t,i){return [String.fromCharCode(65+i),String(t)];});}
  else{q.options=opts.map(function(o){return [String(o[0]).toUpperCase(),String(o[1])];});}
  var ans=raw.answer||[];
  if(!Array.isArray(ans))ans=[ans];
  ans=ans.map(function(x){return String(x).trim().toUpperCase();}).filter(Boolean);
  // 把 "AC" 这种连写拆成 A、C
  if(q.options.length){
    var ex=[];
    ans.forEach(function(a){
      if(/^[A-H]{2,}$/.test(a)){a.split('').forEach(function(c){ex.push(c);});}
      else ex.push(a);
    });
    ans=ex;
  }
  if(q.type==='judge'&&!q.options.length){q.options=[['A','正确'],['B','错误']];}
  if(q.options.length&&q.type==='judge'){
    ans=ans.map(function(a){
      if(/^(对|正确|√|T|TRUE|是|A)$/i.test(a))return 'A';
      if(/^(错|错误|×|X|F|FALSE|否|B)$/i.test(a))return 'B';
      return a;
    });
  }
  q.answer=ans;
  if(!q.type||q.type==='single'){
    if(q.options.length&&q.answer.length>1)q.type='multi';
    else if(!q.options.length)q.type='fill';
  }
  q.id='q';
  return q;
}
/* ---------------- session ---------------- */
var S=null,dir=0,timerH=null;

function startSession(kind,mode,list,opts){
  opts=opts||{};
  S={kind:kind,mode:mode,list:list,i:opts.start||0,ans:{},finished:false,endAt:opts.endAt||0,limit:opts.limit||0};
  dir=0;render();
}
function startPractice(mode){
  var qs=qlist();
  if(!qs.length)return toast('还没有题目，先导入题库');
  var ids=qs.map(function(q){return q.id;});
  if(mode==='wrong'){
    ids=Object.keys(DB.wrong).filter(function(k){return qById(k);});
    if(!ids.length)return toast('错题本是空的，先去练习吧');
    ids=shuffle(ids);
    startSession('practice','wrong',ids,{});
  }else if(mode==='fav'){
    ids=Object.keys(DB.fav).filter(function(k){return qById(k);});
    if(!ids.length)return toast('还没有收藏的题目');
    startSession('practice','fav',shuffle(ids),{});
  }else if(mode==='random'){
    startSession('practice','random',shuffle(ids),{});
  }else if(mode==='unseen'){
    var uids=ids.filter(function(id){return !DB.seen[id];});
    if(!uids.length)return toast('所有题目都刷过啦 🎉');
    startSession('practice','unseen',uids,{});
  }else if(mode==='recite'){
    var rp=Math.min(DB.pos.recite||0,ids.length-1);
    startSession('recite','recite',ids,{start:rp});
  }else{
    var st=Math.min(DB.pos.practice||0,ids.length-1);
    startSession('practice','order',ids,{start:st});
  }
}
var EXAM_SECONDS=30*60;
var EXAM_PLAN={single:60,multi:20,judge:20};
var EXAM_ORDER=['single','multi','judge'];
function startExam(){
  // 有未完成的考试则恢复
  if(DB.examState && DB.examState.list && DB.examState.list.length){
    var st=DB.examState;
    S={kind:'exam',mode:'exam',list:st.list,i:st.i||0,ans:st.ans||{},finished:false,endAt:Date.now()+(st.remainingSec||0)*1000,limit:EXAM_SECONDS,sheetOpen:false};
    dir=0;render();
    return;
  }
  startExamFresh();
}
function startExamFresh(){
  var qs=qlist().filter(function(q){return q.options.length&&q.answer.length;});
  if(!qs.length)return toast('题库里没有可自动判分的客观题');
  var pool={single:[],multi:[],judge:[]};
  qs.forEach(function(q){(pool[q.type]=pool[q.type]||[]).push(q.id);});
  var ids=[];
  // 固定顺序：先单选，再多选，最后判断；每种题型内部随机
  EXAM_ORDER.forEach(function(t){
    ids=ids.concat(shuffle(pool[t]||[]).slice(0,EXAM_PLAN[t]));
  });
  if(!ids.length)return toast('题库里没有可自动判分的客观题');
  startSession('exam','exam',ids,{limit:EXAM_SECONDS,endAt:Date.now()+EXAM_SECONDS*1000});
}
function saveExamState(){
  if(!S||S.kind!=='exam'||S.finished)return;
  var remainingSec=Math.max(0,Math.round((S.endAt-Date.now())/1000));
  DB.examState={list:S.list.slice(),ans:Object.assign({},S.ans),i:S.i,remainingSec:remainingSec};
  save();
}
function clearExamState(){
  DB.examState=null;
  save();
}

/* ---------------- grading ---------------- */
function sameSet(a,b){
  if(a.length!==b.length)return false;
  var x=a.slice().sort().join(','),y=b.slice().sort().join(',');
  return x===y;
}
function grade(q,picked){
  if(!q.answer||!q.answer.length)return null;
  return sameSet(q.answer.map(function(x){return String(x).toUpperCase();}),picked.map(function(x){return String(x).toUpperCase();}));
}
function record(q,ok){
  DB.stats.answered++;
  if(ok)DB.stats.correct++;
  if(!ok){
    var w=DB.wrong[q.id]||{n:0,t:0};w.n++;w.t=Date.now();DB.wrong[q.id]=w;
  }else if(S&&S.mode==='wrong'){
    delete DB.wrong[q.id];
  }
  save();
}

/* ---------------- render ---------------- */
function render(){
  if(timerH){clearInterval(timerH);timerH=null;}
  var app=$('#app');
  var html;
  if(!S)html=homeView();
  else if(S.finished)html=resultView();
  else html=cardView();
  var verbar='<div class="verbar"><span class="ver">TU-V1.1</span><button data-act="ver-info" title="更新时间">🕐</button></div>';
  app.innerHTML=verbar+html;
  bind();
  if(S&&S.kind==='exam'&&!S.finished)tickClock(true);
}
function bind(){
  var app=$('#app');
  app.onclick=onClick;
  var stage=$('#stage');
  if(stage){
    var sx=null,sy=null;
    stage.addEventListener('pointerdown',function(e){
      if(e.target.closest('.opt')||e.target.closest('button')||e.target.closest('textarea'))return;
      sx=e.clientX;sy=e.clientY;
    });
    stage.addEventListener('pointerup',function(e){
      if(sx==null)return;
      var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
      if(Math.abs(dx)<55||Math.abs(dy)>Math.abs(dx))return;
      go(dx<0?1:-1);
    });
  }
  if(S&&S.kind==='exam'&&!S.finished){tickClock();}
}
document.addEventListener('keydown',function(e){
  if(!S||S.finished)return;
  if(e.key==='ArrowRight'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(/^[1-9]$/.test(e.key)){
    var q=qById(S.list[S.i]);if(!q||!q.options.length)return;
    var k=String.fromCharCode(64+Number(e.key));
    if(q.options.some(function(o){return o[0]===k;})){e.preventDefault();pick(k);}
  }
});
function tickClock(first){
  var upd=function(){
    var left=Math.max(0,Math.round((S.endAt-Date.now())/1000));
    var el=$('#clock');
    if(el)el.textContent=fmtTime(left);
    if(left<=0&&!S.finished){finishExam();}
  };
  upd();
  if(timerH)clearInterval(timerH);
  timerH=setInterval(upd,500);
}
function fmtTime(s){
  var m=Math.floor(s/60),ss=s%60;
  return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

    '<p>电脑：← → 切题，数字键 1-9 选答案，点「上一题 / 下一题」也行。</p>'+
  '</div>'+
  '<div class="panel"><h3>记录存在哪</h3>'+
    '<p>练习进度、错题本、收藏都保存在你这台设备的浏览器里，不清缓存就一直在；换设备不会自动同步。</p>'+
  '</div>'+
  '<div class="panel"><h3>关于</h3>'+
    '<p>题库：'+esc(DB.bank.title)+'，共 '+qlist().length+' 题。</p>'+
    '<p class="hint">本页面仅供个人复习使用。</p>'+
  '</div></div>';
}

/* ---------------- actions ---------------- */
function onClick(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='mode'){
    var m=el.getAttribute('data-mode');
    if(m==='exam'){startExam();return;}
    startPractice(m);return;
  }
  if(act==='opt'){pick(el.getAttribute('data-k'));return;}
  if(act==='next'){next();return;}
  if(act==='prev'){go(-1);return;}
  if(act==='confirm'){confirmMulti();return;}
  if(act==='reveal'){revealFill();return;}
  if(act==='self-ok'){selfJudge(true);return;}
  if(act==='self-bad'){selfJudge(false);return;}
  if(act==='fav'){toggleFav();return;}
  if(act==='copy'){
    var q=qById(S.list[S.i]);if(!q)return;
    var lines=[q.stem];
    if(DB.settings.copyOpts!==false){
      (q.options||[]).forEach(function(o){lines.push(o[0]+'. '+o[1]);});
    }
    var text=lines.join('\n');
    function done(){toast('题目已复制');}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){fallbackCopy(text,done);});
    }else{fallbackCopy(text,done);}
    return;
  }
  if(act==='copy-opts'){
    DB.settings.copyOpts=el.checked;
    save();
    return;
  }
  if(act==='restart-exam'){
    if(!confirm('重新开始考试？当前进度和剩余时间将被清空。'))return;
    clearExamState();
    startExamFresh();
    return;
  }
  if(act==='jump'){S.i=Number(el.getAttribute('data-i'));dir=0;if(S.mode==='order')DB.pos.practice=S.i;if(S.mode==='recite')DB.pos.recite=S.i;save();render();return;}
  if(act==='sheet'){S.sheetOpen=!S.sheetOpen;render();return;}
  if(act==='submit'){finishExam();return;}
  if(act==='quit'){
    if(S&&S.kind==='exam'){
      saveExamState();
      if(confirm('退出考试？计时已暂停，下次进入模拟考试将接着考。')){S=null;render();}
    }else{
      if(S&&S.mode==='order')DB.pos.practice=S.i;
      if(S&&S.mode==='recite')DB.pos.recite=S.i;
      save();
      if(confirm('退出本轮？进度已保存。')){S=null;render();}
    }
    return;
  }
  if(act==='home'){S=null;render();return;}
  if(act==='redo-wrong'){
    var ids=S.list.filter(function(id){var a=S.ans[id];return a&&a.ok===false;});
    if(!ids.length)return;
    startSession('practice','wrong',ids,{});return;
  }
  if(act==='settings'){document.querySelector('#app').innerHTML=settingsView();bind();return;}
  if(act==='help'){document.querySelector('#app').innerHTML=helpView();bind();return;}
  if(act==='theme'){toggleTheme();return;}
  if(act==='blind'){DB.settings.blind=!DB.settings.blind;save();render();return;}
  if(act==='ver-info'){toast('更新于 2026-10-23 12:24:53');return;}
  if(act==='showans'){S.revealed=S.revealed||{};S.revealed[S.list[S.i]]=1;render();return;}
  if(act==='reset-wrong'){DB.wrong={};save();toast('错题本已清空');render();return;}
  if(act==='reset-all'){if(confirm('清空所有练习记录、错题和收藏？题库保留。')){DB.wrong={};DB.fav={};DB.stats={answered:0,correct:0};DB.pos={};save();toast('已清空');S=null;render();}return;}
}
function pick(k){
  var q=qById(S.list[S.i]);if(!q||S.finished)return;
  if(S.kind==='recite')return;
  var a=S.ans[q.id]||(S.ans[q.id]={picked:[]});
  if(S.kind==='exam'){
    if(q.type==='multi'){
      var idx=a.picked.indexOf(k);
      if(idx>=0)a.picked.splice(idx,1);else a.picked.push(k);
    }else{
      a.picked=[k];
    }
    render();return;
  }
  if(a.ok!==undefined)return; // 已判过
  if(q.type==='multi'){
    var i2=a.picked.indexOf(k);
    if(i2>=0)a.picked.splice(i2,1);else a.picked.push(k);
    render();return;
  }
  a.picked=[k];
  var ok=grade(q,[k]);
  a.ok=!!ok;
  record(q,a.ok);
  render();
  if(ok)setTimeout(function(){if(S&&!S.finished)next();},450);
}
function confirmMulti(){
  var q=qById(S.list[S.i]);var a=S.ans[q.id];if(!a||!a.picked.length)return;
  a.ok=!!grade(q,a.picked);
  record(q,a.ok);
  render();
  if(a.ok)setTimeout(function(){if(S&&!S.finished)next();},450);
}
function revealFill(){
  var q=qById(S.list[S.i]);var a=S.ans[q.id]||(S.ans[q.id]={picked:[]});
  a.revealed=true;render();
}
function selfJudge(ok){
  var q=qById(S.list[S.i]);var a=S.ans[q.id]||(S.ans[q.id]={picked:[]});
  a.ok=ok;a.self=true;
  record(q,ok);
  render();
  if(ok)setTimeout(function(){if(S&&!S.finished)next();},450);
}
function toggleFav(){
  var id=S.list[S.i];
  if(DB.fav[id])delete DB.fav[id];else DB.fav[id]=1;
  save();render();
}
function go(d){
  if(!S||S.finished)return;
  var n=S.i+d;
  if(n<0||n>=S.list.length)return;
  S.i=n;dir=d;
  if(S.mode==='order')DB.pos.practice=n;
  if(S.mode==='recite')DB.pos.recite=n;
  save();render();
}
function next(){
  if(!S)return;
  if(S.i>=S.list.length-1){
    if(S.kind==='recite'){S=null;toast('这一轮背完了 👏');render();return;}
    S.finished=true;dir=0;render();return;
  }
  S.i++;dir=1;
  if(S.mode==='order')DB.pos.practice=S.i;
  if(S.mode==='recite')DB.pos.recite=S.i;
  save();render();
}
function finishExam(){
  // 记录统计：作答的判分，未作答的按错处理
  S.list.forEach(function(id){
    var q=qById(id),a=S.ans[id];
    if(!q)return;
    if(a&&a.picked&&a.picked.length){
      if(a.ok===undefined)a.ok=!!grade(q,a.picked);
      record(q,a.ok);
    }else{
      S.ans[id]={picked:[],ok:false,blank:true};
      record(q,false);
    }
  });
  clearExamState();
  S.finished=true;dir=0;render();
}

/* ---------------- 主题 ---------------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  var b=document.getElementById('themeBtn');
  if(b)b.textContent=(t==='dark'?'☀':'☾');
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',t==='dark'?'#0b0c0e':'#f2f2ef');
}
function toggleTheme(){
  var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  try{localStorage.setItem('shuati.theme',t);}catch(e){}
  applyTheme(t);
}
function initTheme(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t!=='dark'&&t!=='light')t='light';
  applyTheme(t);
  var b=document.getElementById('themeBtn');
  if(b)b.onclick=toggleTheme;
}

/* ---------------- toast ---------------- */
function fallbackCopy(text,cb){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  ta.remove();if(cb)cb();
}
var toastT=null;
function toast(msg){
  var old=document.querySelector('.toast');if(old)old.remove();
  var d=document.createElement('div');d.className='toast';d.textContent=msg;
  document.body.appendChild(d);d.style.zIndex=999;
  clearTimeout(toastT);
  toastT=setTimeout(function(){d.remove();},1900);
}

/* ---------------- boot ---------------- */
initTheme();
prepareBank();
save();
render();
window.addEventListener('beforeunload',function(){
  if(S&&S.kind==='exam'&&!S.finished)saveExamState();
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S&&S.kind==='exam'&&!S.finished)saveExamState();
});
/* 调试用句柄（不影响正常使用） */
window.STUDY={start:startPractice,exam:startExam,session:function(){return S;},db:function(){return DB;},goto:function(i){if(S){S.i=i;dir=0;render();}}};
})();
</script>
